name: Build Geode Mod

# Gumroad-only distribution: keep automated public builds disabled.
# Re-enable workflow_dispatch temporarily if you need a private CI build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          cli: latest
